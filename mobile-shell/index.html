<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policy Aligned</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f2c46;
    color: #9db4c6;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .shell {
    padding: 24px;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: #ffffff;
    margin: 0 auto 16px auto;
  }
  h1 {
    color: #ffffff;
    font-size: 20px;
    margin: 0 0 8px 0;
  }
  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="mark"></div>
    <h1>Policy Aligned</h1>
    <p>Connecting to your workspace.<br>An internet connection is required.</p>
  </div>
</body>
</html>
